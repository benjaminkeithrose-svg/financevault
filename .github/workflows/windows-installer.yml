# Builds the Windows Setup file on a real Windows computer, installs it,
# and checks the installed program works: it starts, sets up new records,
# reads a scanned document, upgrades existing records (backing them up
# first), updates itself from a (pretend) GitHub release, and leaves the
# records in place when it's uninstalled.
#
# When package.json has a new version number, it then publishes that
# version as a GitHub release — the Setup and update.json — which is where
# installed copies find their automatic updates.
name: Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      # A new version (the version number in package.json) gets its Setup file built and checked.
      - "package.json"
      - ".github/workflows/windows-installer.yml"

jobs:
  build-and-check:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the app's libraries
        run: npm ci --no-audit --no-fund

      - name: Install the desktop build tools
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx install-electron --no

      - name: Build the Setup file
        working-directory: desktop
        run: node build.mjs --win

      - name: Install it (silently, for this Windows user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop/dist" -Filter "Financial Vault Setup *.exe" | Select-Object -First 1
          Write-Host "Installing $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          Stop-Process -Name "Financial Vault" -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Financial Vault.exe" | Select-Object -First 1
          if (-not $exe) { throw "Financial Vault.exe wasn't installed" }
          Write-Host "Installed at $($exe.FullName)"
          "FV_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $desktop = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desktop\Financial Vault.lnk")) { throw "No desktop icon" }
          $start = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Financial Vault.lnk"
          if (-not (Test-Path $start)) { throw "No Start menu entry" }
          Write-Host "Desktop icon and Start menu entry are there."

      - name: Check a first start (new records)
        shell: pwsh
        run: ./desktop/smoke-test.ps1 -Name first

      - name: Check an upgrade (existing records, previous version)
        shell: pwsh
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\fv-data\.installed-version" -Value "1.4.0"
          ./desktop/smoke-test.ps1 -Name upgrade -Passcode "smoke test passcode" -ExpectBackup

      - name: Check an automatic update (from a pretend release)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem "desktop/dist" -Filter "Financial Vault Setup *.exe" | Select-Object -First 1
          # Its own hidden window and log files, so it can't hold this step open.
          $srv = Start-Process node -ArgumentList "desktop/test-release-server.mjs", "`"$($setup.FullName)`"", "4199" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\release-server.log" -RedirectStandardError "$env:RUNNER_TEMP\release-server.err"
          try {
            Start-Sleep -Seconds 3
            $env:FV_UPDATE_FEED = "http://127.0.0.1:4199/releases/latest"
            $env:FV_SMOKE_UPDATE = "1"
            ./desktop/smoke-test.ps1 -Name update -Passcode "smoke test passcode"
            # The downloaded Setup runs silently, reinstalls, then starts the program again by itself —
            # nothing else starts it here. (Windows starts it as the signed-in user, so it opens on the
            # usual data folder, not this test's. The Setup keeps its files' build dates, so those can't
            # show the reinstall.)
            $smokeEnded = Get-Date
            $deadline = (Get-Date).AddMinutes(5)
            do {
              Start-Sleep -Seconds 5
              $again = Get-Process -Name "Financial Vault" -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $smokeEnded }
            } until ($again -or (Get-Date) -gt $deadline)
            Get-Process | Where-Object { $_.ProcessName -like "*Financial*" } | Format-Table ProcessName, Id, StartTime
            if (-not $again) { throw "The program didn't start again after the update's Setup ran" }
            if (Get-Process | Where-Object { $_.ProcessName -like "Financial Vault Setup*" }) { throw "The Setup is still running" }
            Write-Host "Downloaded, checked, backed up, installed silently and started again."
          } finally {
            Stop-Process -Name "Financial Vault" -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\release-server.err" -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }

      - name: Uninstall, and check the records stay
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem (Split-Path $env:FV_EXE) -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $env:FV_EXE) { throw "The program is still there after uninstalling" }
          if (-not (Test-Path "$env:RUNNER_TEMP\fv-data\financevault.db")) { throw "The records went with the program" }
          Write-Host "Uninstalled; the records are still in the data folder."

      - name: Publish this version as a GitHub release (a new version only)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Version $v is already published."; exit 0 }
          $setup = Get-ChildItem "desktop/dist" -Filter "Financial Vault Setup *.exe" | Select-Object -First 1
          node desktop/release-files.mjs $setup.FullName $v release
          if ($LASTEXITCODE -ne 0) { throw "Couldn't make the release files" }
          gh release create "v$v" --target $env:GITHUB_SHA --title "Financial Vault $v" --notes-file release/release-notes.md --latest "release/Financial-Vault-Setup-$v.exe" release/update.json
          if ($LASTEXITCODE -ne 0) { throw "Couldn't publish the release" }
          Write-Host "Published version $v."

      - name: Keep the Setup file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-vault-setup
          path: desktop/dist/Financial Vault Setup *.exe
          retention-days: 7
          if-no-files-found: ignore
