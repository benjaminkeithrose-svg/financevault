<title>Blink Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Is the next property, shares or super move worth researching? Compare plans with leaving the cash in the offset.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a sticky header with the five steps, one working column (max 1080px), results as cards then charts then tables. */
:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --surface-2: #eeedf4;
  --fg: #1d1b2c;
  --muted: #5d5a73;
  --line: #dcdae6;
  --accent: #5b3fd1;
  --accent-ink: #ffffff;
  --accent-soft: #ece8fd;
  --good: #1d7a4f;
  --good-bg: #e3f4ea;
  --warn: #9a5b00;
  --warn-bg: #fdf0d9;
  --danger: #b42318;
  --danger-bg: #fde7e5;
  --s0: #7a7891;
  --s1: #5b3fd1;
  --s2: #0f8a8a;
  --s3: #c2410c;
  --grid: #e7e5ef;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131c; --surface: #1d1c28; --surface-2: #262534; --fg: #ecebf5; --muted: #a9a6bd; --line: #343247;
    --accent: #9d8bff; --accent-ink: #14131c; --accent-soft: #2c2652; --good: #5fd39b; --good-bg: #173326; --warn: #f2b45a; --warn-bg: #3a2b12;
    --danger: #ff8a7d; --danger-bg: #3d1a17; --s0: #a09db8; --s1: #9d8bff; --s2: #4fd1c5; --s3: #fb923c; --grid: #2a2938; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131c; --surface: #1d1c28; --surface-2: #262534; --fg: #ecebf5; --muted: #a9a6bd; --line: #343247;
  --accent: #9d8bff; --accent-ink: #14131c; --accent-soft: #2c2652; --good: #5fd39b; --good-bg: #173326; --warn: #f2b45a; --warn-bg: #3a2b12;
  --danger: #ff8a7d; --danger-bg: #3d1a17; --s0: #a09db8; --s1: #9d8bff; --s2: #4fd1c5; --s3: #fb923c; --grid: #2a2938; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.2; text-wrap: balance; margin: 0; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0; }
.num, td.num, .figure { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-inner, main, .foot {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { padding-block: 10px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.brand .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted); font: 500 14px var(--font-body);
  border-bottom: 3px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.tab b { font: 600 12px var(--font-head); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] b { background: var(--accent); color: var(--accent-ink); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 20px 40px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
section[data-page] { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.intro { display: grid; gap: 6px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--danger); }
input[type="text"], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
  font: 15px var(--font-body); font-variant-numeric: tabular-nums;
}
input.bad { border-color: var(--danger); }
textarea { min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.btn {
  min-height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font: 600 14px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn.secondary { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn.quiet { background: none; border-color: transparent; color: var(--accent); padding: 0 8px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.icon { width: 42px; padding: 0; }
.btn svg { width: 18px; height: 18px; flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 500 14px var(--font-body); cursor: pointer; max-width: 100%; text-align: left; line-height: 1.3; padding-block: 6px;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.banner { border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.example { background: var(--accent-soft); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.note-box { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--danger-bg); color: var(--danger); padding: 8px 10px; border-radius: 8px; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Plans */
.plan-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.plan-tab { min-height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 14px var(--font-body); cursor: pointer; }
.plan-tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.steps { display: grid; gap: 12px; }
.step { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; background: var(--surface); }
.step-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.step-head h4 { display: flex; align-items: center; gap: 10px; }
.yr { font: 600 12px var(--font-head); background: var(--surface-2); border-radius: 6px; padding: 3px 8px; color: var(--muted); }
.add-steps { display: flex; flex-wrap: wrap; gap: 8px; }

/* Results */
.verdicts { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.verdict { border-top: 4px solid var(--c, var(--accent)); align-content: start; }
.verdict .pill { justify-self: start; align-self: start; }
.pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 999px; font: 600 13px var(--font-body); }
.pill.YES { background: var(--good-bg); color: var(--good); }
.pill.MAYBE, .pill.NO { background: var(--warn-bg); color: var(--warn); }
.pill.BASE { background: var(--surface-2); color: var(--muted); }
.big { font: 600 26px var(--font-head); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.chart-controls { display: grid; gap: 10px; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap svg text { fill: var(--muted); font: 12px var(--font-body); }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 170px; z-index: 2; font-variant-numeric: tabular-nums;
}
.tip div { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.legend-chip { display: inline-flex; align-items: center; gap: 8px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th { font-weight: 600; color: var(--muted); background: var(--surface-2); }
thead th:first-child { background: var(--surface-2); }
tr.event td { background: var(--accent-soft); }
tr.event td:first-child { background: var(--accent-soft); }
td.neg { color: var(--warn); }
.chain { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.chain .col { display: grid; gap: 6px; }
.chain .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; font-size: 14px; background: var(--surface); }
.chain .box b { font-variant-numeric: tabular-nums; }
.chain .arrow { font: 600 22px var(--font-head); color: var(--accent); }
.chain .total { background: var(--accent-soft); border-color: var(--accent); }
details > summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 600; }
.foot { padding-block: 0 32px; color: var(--muted); font-size: 13px; max-width: 1080px; }
@media (max-width: 640px) {
  .chain { grid-template-columns: 1fr; }
  .chain .arrow { transform: rotate(90deg); justify-self: center; }
  .big { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  .top, .nav, .no-print, .btn, .add-steps { display: none !important; }
  body { background: #fff; }
  section[data-page] { display: grid !important; }
  section[data-page][hidden] { display: none !important; }
  .card { break-inside: avoid; }
}

/* help */
.label-row { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.label-row label { flex: 0 1 auto; }
.info { position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  font: 600 12px/1 var(--font-body); cursor: pointer; padding: 0; display: inline-grid; place-items: center; }
.info::after { content: ""; position: absolute; inset: -10px; } /* 42px tap area */
.info[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
h3 .info { vertical-align: middle; margin-left: 6px; }
.help-pop { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; font-size: 14px; line-height: 1.5; color: var(--text); font-weight: 400; }
.help-pop .btn { margin-top: 6px; display: flex; }
.btn.small { min-height: 40px; padding: 6px 10px; font-size: 13px; }
.help p, .help li { line-height: 1.6; max-width: 75ch; }
.help ul, .help ol { padding-left: 20px; margin: 0; display: grid; gap: 6px; }
.help-kv { grid-template-columns: minmax(140px, 220px) 1fr; gap: 10px 16px; }
.help-kv dt { color: var(--text); font-weight: 600; }
.help-kv dd { text-align: left; font-weight: 400; line-height: 1.55; font-variant-numeric: normal; }
@media (max-width: 560px) { .help-kv { grid-template-columns: 1fr; gap: 2px; } .help-kv dd { margin-bottom: 10px; } }
pre.guide { white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: 12.5px; line-height: 1.5; }

/* red flag: the plan probably can't be done */
.pill.STOP { background: var(--danger-bg); color: var(--danger); gap: 6px; }
.pill svg, .red-flag svg { width: 16px; height: 16px; flex: none; }
.red-flag { border: 2px solid var(--danger); background: var(--danger-bg); color: var(--fg); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
.red-flag-head { display: flex; align-items: center; gap: 8px; color: var(--danger); font-size: 15px; }
.red-flag.big { margin-bottom: 14px; }
.red-flag.big .red-flag-head { font: 600 18px var(--font-head); }
.red-flag.big svg { width: 22px; height: 22px; }
.red-flag ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.red-flag p { margin: 0; }
.amber-flag { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.amber-flag p { margin: 0; }
/* wealth, debt and cash flow */
.at-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
.at-row label { font-size: 13px; font-weight: 500; color: var(--muted); }
.at-row input[type="range"] { flex: 1 1 200px; min-height: 40px; accent-color: var(--accent); }
.at-row output { font: 600 15px var(--font-head); min-width: 64px; }
.diff-words { margin: 8px 0 12px; padding-left: 20px; display: grid; gap: 6px; line-height: 1.55; max-width: 75ch; }
.diff-table td:first-child, .diff-table th:first-child { text-align: left; white-space: normal; min-width: 150px; }
.diff-table th .dot { display: inline-block; vertical-align: middle; }

/* chart key */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg); margin-top: 4px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-item svg { flex: none; }
.base-explain { line-height: 1.55; }

.amber-flag.big-amber { border: 2px solid var(--warn); display: grid; gap: 4px; margin-bottom: 14px; }
.amber-flag.big-amber b { color: var(--fg); }
</style>
